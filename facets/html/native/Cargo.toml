[package]
name = "html_native"
version = "0.1.0"
edition = "2024"
publish = false
description = "The native part of Grenat's official facet `html`: CSS selectors on HTML"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# the SDK of native facets, from crates.io; inside a Grenat checkout, the
# checkout's own (patched in by `setter install`, and by facets/.cargo/config.toml
# for cargo run by hand)
grenat_ext = "0.1"
ego-tree = "0.11"
html5ever = "0.39"
scraper = { version = "0.27", default-features = false, features = ["errors", "deterministic"] }
url = "2"

# a crate of its own, not a member of Grenat's workspace
[workspace]
