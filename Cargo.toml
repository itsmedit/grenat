[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itsmedit/grenat"
rust-version = "1.88"

[workspace.dependencies]
grenat_lexer = { path = "crates/grenat_lexer" }
grenat_ast = { path = "crates/grenat_ast" }
grenat_parser = { path = "crates/grenat_parser" }
grenat_llm = { path = "crates/grenat_llm" }
grenat_interp = { path = "crates/grenat_interp" }
grenat_types = { path = "crates/grenat_types" }
grenat_codegen = { path = "crates/grenat_codegen" }
grenat_runtime = { path = "crates/grenat_runtime" }
grenat_driver = { path = "crates/grenat_driver" }
grenat_report = { path = "crates/grenat_report" }
grenat_fmt = { path = "crates/grenat_fmt" }
grenat_standalone = { path = "crates/grenat_standalone" }
grenat_green = { path = "crates/grenat_green" }
grenat_host = { path = "crates/grenat_host" }
grenat_package = { path = "crates/grenat_package" }
grenat_lsp = { path = "crates/grenat_lsp" }
grenat_macros = { path = "crates/grenat_macros" }
grenat_db = { path = "crates/grenat_db" }
grenat_mcp = { path = "crates/grenat_mcp" }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
