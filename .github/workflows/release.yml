name: Release

# A `v*` tag: the binaries of each platform, packaged with the runtime
# libraries `grenat build` links; Linux packages (.deb, .rpm); the install
# script; the VS Code extension (.vsix); a GitHub release; then the Docker
# image, built from that release. The SDK of native facets (grenat_ext,
# grenat_ext_macros) is checked publishable here, not published: that is a
# manual step (RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p grenat_cli -p grenat_setter -p grenat_host -p grenat_standalone
      - name: Package and check
        run: scripts/release-package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: amd64, nfpm: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64, nfpm: arm64 }
    runs-on: ${{ matrix.os }}
    # an older glibc (2.31): the binaries run on Ubuntu 20.04+, Debian 11+,
    # Amazon Linux 2023, RHEL 9, Fedora…
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p grenat_cli -p grenat_setter -p grenat_host -p grenat_standalone
      - name: Package and check
        run: scripts/release-package.sh "${{ matrix.target }}"
      - name: Linux packages (.deb, .rpm)
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${{ matrix.nfpm }}.tar.gz" | tar xz -C /usr/local/bin nfpm
          export ARCH="${{ matrix.arch }}" VERSION="${GITHUB_REF_NAME#v}"
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  # grenat_ext and grenat_ext_macros still package and build as crates.io
  # would have them (a dry run, nothing uploaded): the release fails early
  # otherwise. The two in one command: grenat_ext is verified against the
  # macros just packaged, even before they are on crates.io.
  crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The SDK's packages
        run: |
          cargo package --list -p grenat_ext_macros
          cargo package --list -p grenat_ext
      - name: Dry run of the SDK's publication
        run: cargo publish --dry-run -p grenat_ext_macros -p grenat_ext

  release:
    needs: [macos, linux, crates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VS Code extension (.vsix)
        working-directory: editors/vscode
        run: |
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npx @vscode/vsce package --out "$GITHUB_WORKSPACE/dist/"
          ls "$GITHUB_WORKSPACE/dist"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.sh
          --repo "$GITHUB_REPOSITORY" --title "Grenat $GITHUB_REF_NAME" --generate-notes

  docker:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        run: |
          cp scripts/install.sh packaging/
          version="${GITHUB_REF_NAME#v}"
          docker buildx build packaging \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.description="Grenat: an agentic programming language" \
            --label org.opencontainers.image.licenses="MIT OR Apache-2.0" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:$version" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:latest" \
            --push

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    env:
      # a token that may push to itsmedit/homebrew-grenat; without it, the
      # formula is updated by hand (scripts/homebrew-formula.sh)
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - name: Update the tap's formula
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/itsmedit/homebrew-grenat.git" tap
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" > tap/Formula/grenat.rb
          cd tap
          git config user.name "Mehdi Farsi"
          git config user.email "mehdifarsi.pro@gmail.com"
          git add Formula/grenat.rb
          git commit -m "grenat ${GITHUB_REF_NAME#v}"
          git push
      - name: No token
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; update the tap with scripts/homebrew-formula.sh $GITHUB_REF_NAME"
