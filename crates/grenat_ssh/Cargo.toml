[package]
name = "grenat_ssh"
description = "SSH and SFTP for Grenat programs: host keys verified, remote commands quoted, a blocking API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Pure Rust: `ring` rather than the default aws-lc-rs (no C toolchain, no system library).
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "fs"] }
# Hashed known_hosts entries (`|1|salt|hash`): HMAC-SHA1 of the host name.
hmac = "0.13"
sha1 = "0.11"
# Host and user keys generated by the fake server.
rand = { version = "0.10", optional = true }

[dev-dependencies]
grenat_ssh = { path = ".", features = ["fake"] }
rand = "0.10"

[features]
# A real SSH server (and a SOCKS5 proxy) in process, for the tests of this
# crate and of its users.
fake = ["dep:rand", "tokio/rt-multi-thread", "tokio/sync"]
