[package]
name = "grenat_ext_macros"
description = "The macros of grenat_ext: `#[export]` and `#[derive(GrenatType)]` for native facets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# the lists of `grenat.rs` are compared with Grenat's own
grenat_ast.workspace = true
grenat_lexer.workspace = true
