[package]
name = "grenat_watch"
description = "A folder watched for files dropped in it: glob patterns, settling, contents told apart, links held inside: what wakes `on_file`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sha2 = "0.11"
# `O_NOFOLLOW`, `O_NONBLOCK` and `F_GETPATH`: a file opened is checked, not its name
libc = "0.2"
# The operating system's notifications: inotify on Linux, FSEvents on macOS
# (the default backend), ReadDirectoryChangesW on Windows. Only a wake-up:
# scanning the folder decides what changed.
notify = { version = "8", optional = true }

[features]
default = ["watch"]
# The watcher (`Wake`); without it, patterns, scans and settling only (the checker).
watch = ["dep:notify"]
