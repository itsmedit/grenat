[package]
name = "grenat_types"
description = "Static checking for Grenat: names, types, effects and taint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# A Teams secret written out is base64, as the runtime decodes it.
base64 = "0.22"
grenat_ast.workspace = true
grenat_llm.workspace = true
# Rates written out, held to what the runtime allows.
grenat_limits.workspace = true
# Patterns only (`on_file`): parsed as the runtime parses them.
grenat_watch.workspace = true

[dev-dependencies]
grenat_parser.workspace = true
